<!DOCTYPE html>
<html lang="zh-CN" data-theme="ink">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daydesk · 方向 C 静室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1220;
      --bg-nav: #0a0f1a;
      --surface: #121a2a;
      --ink: #e8edf5;
      --muted: #8b9cb3;
      --line: #243049;
      --brand: #6b9fd4;
      --accent: #3b6fd9;
      --accent-glow: rgba(59, 111, 217, 0.35);
      --danger: #f472b6;
      --sans: "Inter", "PingFang SC", sans-serif;
      --serif: "Instrument Serif", "Songti SC", serif;
      --mono: "JetBrains Mono", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; min-height: 100dvh; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 400; margin: 0; letter-spacing: -0.01em; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .layout { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100dvh; }
    .rail { padding: 32px 20px; background: var(--bg-nav); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
    .rail .wordmark { font-family: var(--serif); font-size: 1.5rem; margin-bottom: 32px; color: var(--ink); }
    .rail button { text-align: left; padding: 10px 12px 10px 14px; border-radius: 8px; color: var(--muted); min-height: 44px; border-left: 2px solid transparent; }
    .rail button.on { color: var(--brand); background: rgba(59, 111, 217, 0.08); border-left-color: var(--accent); font-weight: 600; }
    .rail .foot { margin-top: auto; font-size: 13px; color: var(--muted); font-family: var(--mono); }
    .main { padding: 40px clamp(20px, 4vw, 48px) 80px; max-width: 880px; }
    .kicker { font-family: var(--mono); font-size: 12px; color: var(--brand); letter-spacing: 0.08em; margin: 0 0 8px; }
    h1 { font-size: clamp(2.25rem, 5vw, 3rem); margin-bottom: 10px; }
    .sub { color: var(--muted); font-size: 15px; max-width: 42ch; margin: 0 0 32px; }
    .capture { display: flex; gap: 10px; margin-bottom: 40px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 0 0 1px rgba(255,255,255,.03), 0 20px 50px rgba(0,0,0,.35); }
    .capture input { flex: 1; background: transparent; border: 0; min-height: 44px; padding: 0 12px; color: var(--ink); outline: none; }
    .capture input::placeholder { color: var(--muted); }
    .btn { min-height: 44px; padding: 0 18px; border-radius: 8px; font-weight: 600; background: var(--accent); color: #fff; box-shadow: 0 0 24px var(--accent-glow); }
    .focus-trio { display: grid; gap: 14px; margin-bottom: 36px; }
    .focus-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: start; transition: border-color 0.18s, box-shadow 0.18s; }
    .focus-card:hover { border-color: #3d5080; box-shadow: 0 0 32px rgba(59, 111, 217, 0.12); }
    .focus-card .num { font-family: var(--mono); font-size: 13px; color: var(--brand); padding-top: 4px; }
    .focus-card h3 { font-family: var(--sans); font-size: 1.0625rem; font-weight: 600; }
    .focus-card .meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .focus-card.hero { border-color: #4a6ab8; box-shadow: 0 0 40px rgba(59, 111, 217, 0.2); }
    .focus-card.hero .num { color: var(--accent); }
    .focus-card.warn { border-color: rgba(244, 114, 182, 0.45); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
    .tile h2 { font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--muted); text-transform: none; margin-bottom: 12px; }
    .tile li { list-style: none; font-size: 14px; padding: 8px 0; border-top: 1px solid var(--line); color: var(--ink); }
    .tile ul { margin: 0; padding: 0; }
    .tile li:first-child { border-top: 0; padding-top: 0; }
    .bar { height: 4px; background: var(--line); border-radius: 99px; margin-top: 8px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--brand)); width: 40%; }
    .tag-demo { position: fixed; top: 12px; right: 12px; background: var(--accent); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 6px; z-index: 9; }
    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .rail { display: none; }
      .grid2 { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <p class="tag-demo">方向 C · 静室</p>
  <div class="layout">
    <aside class="rail">
      <p class="wordmark">Daydesk</p>
      <button type="button" class="on">今天</button>
      <button type="button">待办</button>
      <button type="button">灵感</button>
      <button type="button">日程</button>
      <button type="button">复盘</button>
      <button type="button">设置</button>
      <p class="foot">墨蓝 · 自用服务器</p>
    </aside>
    <main class="main">
      <p class="kicker">W48 · 11-26</p>
      <h1>今天</h1>
      <p class="sub">暗一点，让三件事浮在上面。下面才是时间和本周要交的。</p>
      <form class="capture" onsubmit="return false">
        <input type="text" placeholder="记下一句，回车放进收集箱" aria-label="灵感">
        <button class="btn" type="submit">收下</button>
      </form>
      <section class="focus-trio" aria-labelledby="trio-h">
        <h2 id="trio-h" class="visually-hidden">现在就做这三件</h2>
        <article class="focus-card hero warn">
          <span class="num">01</span>
          <div>
            <h3>把周报发给项目组</h3>
            <p class="meta">逾期 · 高优先级 · 本周目标</p>
          </div>
        </article>
        <article class="focus-card">
          <span class="num">02</span>
          <div>
            <h3>整理下午会议材料</h3>
            <p class="meta">16:00 日程已占位</p>
          </div>
        </article>
        <article class="focus-card">
          <span class="num">03</span>
          <div>
            <h3>回复张总关于预算的邮件</h3>
            <p class="meta">等待别人 · 第 4 天</p>
          </div>
        </article>
      </section>
      <div class="grid2">
        <section class="tile">
          <h2>今天的时间</h2>
          <ul>
            <li><strong>09:30</strong> 站会</li>
            <li><strong>16:00</strong> 整理会议材料</li>
          </ul>
        </section>
        <section class="tile">
          <h2>本周要交出去的</h2>
          <ul>
            <li>MVP 演示可点击<div class="bar"><span></span></div></li>
            <li>复盘模板定稿<div class="bar"><span style="width:18%"></span></div></li>
            <li>灵感文章发布<div class="bar"><span style="width:50%"></span></div></li>
          </ul>
        </section>
      </div>
    </main>
  </div>
  <style>.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}</style>
</body>
</html>
