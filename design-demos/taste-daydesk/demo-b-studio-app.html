<!doctype html>
<!-- tasteskill · Daydesk demo B · studio-grey · schibsted · sharp · in-app focus -->
<html lang="zh-CN" data-type="software" data-radius="sharp" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="page-type" content="software">
  <meta name="site-kind" content="software">
  <title>Daydesk · 棚灰 focus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/system.css">
  <link rel="stylesheet" href="assets/motion/motion.css">
  <link rel="stylesheet" href="assets/dd-demo.css">
  <style>
    :root {
      --p-bg: #a8a8aa; --p-surface: #b4b4b6; --p-ink: #0e0e0e; --p-muted: #3a3a3c;
      --p-accent: #1f5c49; --p-accent-ink: #ffffff; --p-action: #1f5c49; --p-action-ink: #ffffff;
      --font-display: "Schibsted Grotesk", system-ui, sans-serif;
      --font-text: "Schibsted Grotesk", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --display-weight: 400; --display-tracking: -0.035em;
    }
    body { margin: 0; min-height: 100dvh; background: var(--p-bg); }
    .dd-shell { min-height: 100dvh; grid-template-columns: 1fr; }
    .dd-frame { min-height: 100dvh; border-radius: 0; box-shadow: none; border: 0; }
    .dd-side { background: #9e9ea0; }
    .dd-main { max-width: 720px; margin-inline: auto; }
    .dd-trio .dd-task { background: #c6c6c8; border-color: color-mix(in oklab, var(--p-ink) 14%, transparent); }
    .dd-trio .dd-task.is-late { border-left: 4px solid #c2410c; }
    .dd-top {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
      margin-bottom: var(--s-6, 24px); padding-bottom: 16px;
      border-bottom: 2px solid color-mix(in oklab, var(--p-ink) 20%, transparent);
    }
    .dd-top .mono { font-family: var(--font-mono); font-size: 13px; color: var(--p-muted); }
    .demo-tag { position: fixed; top: 12px; right: 12px; z-index: 99; font-size: 12px; padding: 6px 10px; background: var(--p-ink); color: var(--p-bg); border-radius: 4px; }
    .dd-capture .btn-go {
      min-height: 44px; padding: 0 16px; background: var(--p-action); color: var(--p-action-ink);
      border: 0; border-radius: 6px; font-weight: 600;
    }
  </style>
</head>
<body class="dd-shell" data-enter>
  <p class="demo-tag">taste · B 棚灰 focus</p>
  <div class="dd-frame">
    <aside class="dd-side">
      <p class="logo">Daydesk</p>
      <nav>
        <span class="is-on">今天</span>
        <span>待办</span>
        <span>灵感</span>
        <span>日程</span>
        <span>复盘</span>
        <span>设置</span>
      </nav>
    </aside>
    <main class="dd-main">
      <header class="dd-top">
        <div>
          <p class="mono">W48 · 2026-11-26</p>
          <h2 class="dd-h">今天</h2>
        </div>
        <button type="button" class="btn-go">保存复盘</button>
      </header>
      <form class="dd-capture" onsubmit="return false">
        <input type="text" placeholder="记下一句，回车放进收集箱" aria-label="灵感">
        <button class="btn-go" type="submit">收下</button>
      </form>
      <section aria-labelledby="t3">
        <h2 id="t3" class="dd-h" style="font-size:1rem;color:var(--p-muted);margin-bottom:12px">现在就做这三件</h2>
        <div class="dd-trio">
          <article class="dd-task is-late">
            <span class="ix">01</span>
            <strong>把周报发给项目组</strong>
            <span class="tag">逾期</span>
            <p class="meta">本周 · MVP 演示</p>
          </article>
          <article class="dd-task">
            <span class="ix">02</span>
            <strong>整理下午会议材料</strong>
            <span class="tag">16:00</span>
          </article>
          <article class="dd-task">
            <span class="ix">03</span>
            <strong>回复预算邮件</strong>
            <span class="tag">等待 4 天</span>
          </article>
        </div>
      </section>
      <div class="dd-board" style="margin-top:24px">
        <section class="dd-tile">
          <h3>今天的时间</h3>
          <ul>
            <li>09:30 站会</li>
            <li>16:00 整理会议材料</li>
          </ul>
        </section>
        <section class="dd-tile">
          <h3>要看一眼</h3>
          <ul>
            <li>续费域名 · 逾期 2 天</li>
          </ul>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="assets/motion/motion.js"></script>
</body>
</html>
