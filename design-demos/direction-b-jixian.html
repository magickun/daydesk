<!DOCTYPE html>
<html lang="zh-CN" data-theme="stone">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daydesk · 方向 B 脊线</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #eef6f4;
      --surface: #ffffff;
      --ink: #0f3d38;
      --muted: #4a6f6a;
      --line: #b8d9d2;
      --brand: #0f766e;
      --accent: #115e59;
      --now: #c2410c;
      --sans: "Manrope", "PingFang SC", sans-serif;
      --serif: "Fraunces", "Songti SC", serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); font-size: 16px; color: var(--ink); background: var(--bg); min-height: 100dvh; }
    h1, h2 { font-family: var(--serif); margin: 0; font-weight: 600; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100dvh; }
    .side { background: var(--surface); border-right: 1px solid var(--line); padding: 24px 16px; }
    .side .logo { font-family: var(--serif); font-size: 1.35rem; margin-bottom: 32px; }
    .side a, .side button { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 10px; color: var(--muted); min-height: 44px; }
    .side .on { background: var(--bg); color: var(--brand); font-weight: 700; }
  .workspace { display: grid; grid-template-rows: auto 1fr; max-height: 100dvh; overflow: hidden; }
    .priorities { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-bottom: 2px solid var(--brand); }
    .prio { background: var(--surface); padding: 20px 22px; min-height: 108px; display: flex; flex-direction: column; gap: 8px; }
    .prio .ix { font-size: 12px; font-weight: 700; color: var(--brand); letter-spacing: 0.06em; }
    .prio strong { font-size: 1.05rem; line-height: 1.35; }
    .prio.late { background: #fff8f4; }
    .prio.late strong::after { content: " · 逾期"; font-size: 13px; color: var(--now); font-weight: 700; }
    .day-grid { display: grid; grid-template-columns: 72px 1fr 280px; flex: 1; overflow: auto; background: var(--surface); }
    .hours { border-right: 1px solid var(--line); padding: 12px 0; position: relative; }
    .hour { height: 56px; padding: 4px 10px 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); }
    .hour:first-child { border-top: 0; }
    .now-mark { position: absolute; left: 0; right: 0; top: 168px; height: 2px; background: var(--now); z-index: 2; }
    .now-mark::before { content: "现在 09:14"; position: absolute; left: 6px; top: -20px; font-size: 11px; font-weight: 700; color: var(--now); }
    .blocks { position: relative; padding: 12px 16px; border-right: 1px solid var(--line); }
    .block { position: absolute; left: 16px; right: 16px; border-radius: 10px; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); background: var(--bg); }
    .block.a { top: 48px; height: 52px; border-color: var(--brand); background: #e6f6f3; }
    .block.b { top: 280px; height: 72px; }
    .dock { padding: 20px 18px; background: var(--bg); overflow: auto; }
    .dock h2 { font-family: var(--sans); font-size: 14px; text-transform: none; margin-bottom: 12px; color: var(--muted); font-weight: 700; }
    .cap { display: flex; gap: 8px; margin-bottom: 20px; }
    .cap input { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--surface); }
    .cap button { min-height: 44px; padding: 0 16px; background: var(--accent); color: #fff; font-weight: 700; border-radius: 10px; }
    .inbox li { list-style: none; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .inbox ul { margin: 0; padding: 0; }
    .tag-demo { position: fixed; top: 12px; right: 12px; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 6px; z-index: 9; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .side { display: none; }
      .priorities { grid-template-columns: 1fr; }
      .day-grid { grid-template-columns: 56px 1fr; }
      .dock { display: none; }
    }
  </style>
</head>
<body>
  <p class="tag-demo">方向 B · 脊线</p>
  <div class="app">
    <aside class="side">
      <p class="logo">Daydesk</p>
      <button type="button" class="on">今天</button>
      <button type="button">待办</button>
      <button type="button">灵感</button>
      <button type="button">日程</button>
      <button type="button">复盘</button>
    </aside>
    <div class="workspace">
      <header class="priorities" aria-label="现在就做这三件">
        <article class="prio late"><span class="ix">第 1 件</span><strong>把周报发给项目组</strong></article>
        <article class="prio"><span class="ix">第 2 件</span><strong>整理下午会议材料</strong></article>
        <article class="prio"><span class="ix">第 3 件</span><strong>回复张总关于预算的邮件</strong></article>
      </header>
      <div class="day-grid">
        <div class="hours" aria-hidden="true">
          <div class="hour">08:00</div>
          <div class="hour">09:00</div>
          <div class="hour">10:00</div>
          <div class="hour">11:00</div>
          <div class="hour">12:00</div>
          <div class="hour">13:00</div>
          <div class="hour">14:00</div>
          <div class="hour">15:00</div>
          <div class="hour">16:00</div>
          <div class="now-mark"></div>
        </div>
        <div class="blocks" aria-label="今天的时间">
          <div class="block a"><strong>站会</strong> · 09:30</div>
          <div class="block b"><strong>整理会议材料</strong> · 16:00–17:00</div>
        </div>
        <aside class="dock">
          <h2>收集箱</h2>
          <form class="cap" onsubmit="return false">
            <input type="text" placeholder="记下一句灵感" aria-label="灵感">
            <button type="submit">收下</button>
          </form>
          <ul class="inbox">
            <li>要不要把 Daydesk 部署文档单独成页</li>
            <li>周五复盘前提醒李小满交图</li>
            <li>读那篇关于 GTD 过载的文章</li>
          </ul>
        </aside>
      </div>
    </div>
  </div>
</body>
</html>
