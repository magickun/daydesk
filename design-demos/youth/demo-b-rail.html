<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方向 B · 色带分区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6fffb;
      --surface: #ffffff;
      --ink: #0f2922;
      --muted: #4f6b63;
      --line: #cce8de;
      --sans: "Plus Jakarta Sans", "PingFang SC", sans-serif;
      --mono: "JetBrains Mono", monospace;
      --c-task: #10b981;
      --c-inbox: #38bdf8;
      --c-risk: #fb923c;
      --c-time: #6366f1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--bg); font-size: 15px; line-height: 1.45; }
    .tag { position: fixed; top: 12px; right: 12px; font-size: 12px; padding: 6px 10px; background: var(--ink); color: #fff; border-radius: 8px; }
    .layout { max-width: 920px; margin: 0 auto; display: grid; grid-template-columns: 200px 1fr; gap: 0; min-height: 100dvh; }
    .nav { padding: 24px 16px; border-right: 1px solid var(--line); background: color-mix(in oklab, var(--bg) 70%, white); }
    .nav .logo { font-weight: 700; font-size: 1.1rem; margin-bottom: 24px; color: var(--c-task); }
    .nav button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 10px; font: inherit; color: var(--muted); min-height: 44px; cursor: pointer; }
    .nav .on { background: var(--surface); font-weight: 700; color: var(--ink); box-shadow: 0 1px 0 var(--line); }
    main { padding: 28px 32px 48px; }
    h1 { margin: 0; font-size: 1.85rem; letter-spacing: -0.02em; }
    .sub { margin: 4px 0 20px; color: var(--muted); font-size: 14px; font-family: var(--mono); }
    .capture { display: flex; gap: 8px; margin-bottom: 24px; max-width: 480px; }
    .capture input { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--surface); }
    .capture button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--c-task); color: #fff; font-weight: 700; cursor: pointer; }
    .zone {
      position: relative; padding: 16px 16px 16px 20px; margin-bottom: 16px;
      background: var(--surface); border-radius: 14px; border: 1px solid var(--line);
    }
    .zone::before {
      content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 4px;
    }
    .zone--task::before { background: var(--c-task); }
    .zone--inbox::before { background: var(--c-inbox); }
    .zone--risk::before { background: var(--c-risk); }
    .zone--time::before { background: var(--c-time); }
    .zone h2 { margin: 0 0 12px; font-size: 14px; font-weight: 700; text-transform: none; color: var(--muted); }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
    .row:first-of-type { border-top: 0; padding-top: 0; }
    .row time { font-family: var(--mono); font-size: 13px; color: var(--muted); }
    .bento { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; margin-bottom: 16px; }
    .spark-lane { margin-top: 32px; padding-top: 20px; border-top: 1px solid var(--line); }
    .lane-head { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .lane-head span { font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
    .lane-head .active { border-color: var(--c-inbox); color: var(--c-inbox); background: #eff9ff; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .nav { display: none; } .bento { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <p class="tag">B · 色带分区</p>
  <div class="layout">
    <aside class="nav">
      <p class="logo">Daydesk</p>
      <button type="button" class="on">今天</button>
      <button type="button">待办</button>
      <button type="button">灵感</button>
      <button type="button">日程</button>
      <button type="button">复盘</button>
    </aside>
    <main>
      <h1>今天</h1>
      <p class="sub">11-26 · 周三 · 第 48 周</p>
      <form class="capture" onsubmit="return false">
        <input type="text" placeholder="记下一句灵感" aria-label="灵感">
        <button type="submit">收下</button>
      </form>
      <div class="bento">
        <section class="zone zone--task">
          <h2>现在就做三件</h2>
          <div class="row"><span>把周报发给项目组</span><span style="color:var(--c-risk);font-size:13px;font-weight:600">逾期</span></div>
          <div class="row"><span>整理会议材料</span><span style="font-size:13px;color:var(--muted)">高</span></div>
          <div class="row"><span>回复预算邮件</span><span style="font-size:13px;color:var(--muted)">等</span></div>
        </section>
        <section class="zone zone--inbox">
          <h2>收集箱 · 3 条</h2>
          <div class="row"><span>部署文档单独一页？</span></div>
          <div class="row"><span>周五提醒交图</span></div>
          <div class="row"><span>读 GTD 过载</span></div>
        </section>
      </div>
      <section class="zone zone--risk">
        <h2>要看一眼</h2>
        <div class="row"><span>续费域名</span><span style="font-size:13px;color:var(--c-risk)">逾期 2 天</span></div>
      </section>
      <div class="bento">
        <section class="zone zone--time">
          <h2>今天的时间</h2>
          <div class="row"><time>09:30</time><span>站会</span></div>
          <div class="row"><time>16:00</time><span>整理材料</span></div>
        </section>
        <section class="zone zone--task">
          <h2>本周要交</h2>
          <div class="row"><span>MVP 演示</span><span style="font-family:var(--mono)">2/5</span></div>
          <div class="row"><span>复盘模板</span><span style="font-family:var(--mono)">0/3</span></div>
        </section>
      </div>
      <section class="spark-lane" aria-label="灵感页 preview">
        <h2 style="font-size:14px;color:var(--muted);margin:0 0 10px">灵感页 Preview · 泳道标签</h2>
        <div class="lane-head">
          <span class="active">收集箱</span>
          <span>培育</span>
          <span>写作中</span>
          <span>实践中</span>
        </div>
        <div class="zone zone--inbox" style="margin:0"><div class="row"><span>晨会只讲三件事</span></div></div>
      </section>
    </main>
  </div>
</body>
</html>
