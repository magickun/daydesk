<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方向 A · 气泡清单</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4fbff;
      --surface: #fff;
      --ink: #15262b;
      --muted: #5d7279;
      --line: #d9eef5;
      --brand: #0891b2;
      --accent: #0e7490;
      --peach: #fb7185;
      --sans: "Figtree", "PingFang SC", sans-serif;
      --mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); color: var(--ink); font-size: 16px; line-height: 1.45;
      min-height: 100dvh;
      background:
        radial-gradient(80% 50% at 0% 0%, #dbeafe, transparent 55%),
        radial-gradient(70% 40% at 100% 10%, #cffafe, transparent 50%),
        var(--bg);
    }
    .tag { position: fixed; top: 12px; right: 12px; font-size: 12px; padding: 6px 10px; background: var(--ink); color: #fff; border-radius: 8px; z-index: 9; }
    .shell { max-width: 420px; margin: 0 auto; padding: 20px 16px 48px; }
    .top { margin-bottom: 20px; }
    .date-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 999px; background: var(--surface);
      border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--brand);
      box-shadow: 0 8px 24px -16px rgba(8,145,178,.35);
    }
  h1 { margin: 12px 0 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
    .muted { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
    .capture {
      display: flex; gap: 8px; margin: 20px 0 24px; padding: 5px 5px 5px 14px;
      background: var(--surface); border-radius: 999px; border: 1px solid var(--line);
    }
    .capture input { flex: 1; border: 0; min-height: 44px; background: transparent; font: inherit; outline: none; }
    .capture button {
      border: 0; border-radius: 999px; padding: 0 18px; min-height: 44px;
      background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
    }
    h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: var(--muted); }
    .bubble {
      display: grid; grid-template-columns: 28px 1fr auto;
      gap: 12px; align-items: center;
      padding: 14px 16px; margin-bottom: 10px;
      background: var(--surface); border-radius: 20px;
      border: 1px solid var(--line);
      box-shadow: 0 10px 28px -22px rgba(21,38,43,.2);
    }
    .bubble:hover { transform: translateY(-1px); transition: transform .15s ease; }
    .ring {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--brand); opacity: .85;
    }
    .bubble.late .ring { border-color: var(--peach); }
    .bubble strong { font-size: 16px; font-weight: 600; display: block; }
    .bubble small { font-size: 12px; color: var(--muted); margin-top: 2px; display: block; }
    .mini-btn { font-size: 12px; font-weight: 600; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; color: var(--ink); }
    .panel { margin-top: 28px; padding-top: 24px; border-top: 1px dashed var(--line); }
    .list-row {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: var(--surface); border-radius: 16px; margin-bottom: 8px;
      border: 1px solid var(--line);
    }
    .list-row .ring { width: 20px; height: 20px; flex: none; }
    @media (prefers-reduced-motion: reduce) { .bubble:hover { transform: none; } }
  </style>
</head>
<body>
  <p class="tag">A · 气泡清单</p>
  <div class="shell">
    <header class="top">
      <span class="date-pill"><span style="font-family:var(--mono)">W48</span> 11月26日 周三</span>
      <h1>今天</h1>
      <p class="muted">三件做完，今天就算赢一半。</p>
    </header>
    <form class="capture" onsubmit="return false">
      <input type="text" placeholder="灵光一现，先扔进来" aria-label="灵感">
      <button type="submit">收下</button>
    </form>
    <h2>现在就做</h2>
    <article class="bubble late">
      <span class="ring" aria-hidden="true"></span>
      <div><strong>把周报发给项目组</strong><small>逾期 · 本周 MVP</small></div>
      <button type="button" class="mini-btn">完成</button>
    </article>
    <article class="bubble">
      <span class="ring"></span>
      <div><strong>整理下午会议材料</strong><small>16:00 已排</small></div>
      <button type="button" class="mini-btn">完成</button>
    </article>
    <article class="bubble">
      <span class="ring"></span>
      <div><strong>回复预算邮件</strong><small>等对方 · 4 天</small></div>
      <button type="button" class="mini-btn">明天</button>
    </article>
    <section class="panel" aria-labelledby="todo-prev">
      <h2 id="todo-prev">待办页 Preview · 同样气泡</h2>
      <div class="list-row"><span class="ring"></span><span>购买年会礼品</span></div>
      <input class="list-row" style="width:100%;border-style:dashed;color:var(--muted)" readonly value="+ 新增待办" aria-label="新增示意">
    </section>
  </div>
</body>
</html>
