<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daydesk · 方向 A 刻印</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe4;
      --surface: #fffcf7;
      --ink: #1a1814;
      --muted: #5c564e;
      --line: #d9cfc0;
      --brand: #8b4518;
      --accent: #3730a3;
      --danger: #9b2335;
      --serif: "Newsreader", "Songti SC", serif;
      --sans: "IBM Plex Sans", "PingFang SC", sans-serif;
    }
  *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; min-height: 100dvh; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.02em; }
    a { color: var(--accent); }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .shell { display: grid; grid-template-columns: 200px 1fr; min-height: 100dvh; }
    .nav { padding: 28px 16px 24px 24px; border-right: 1px solid var(--line); background: linear-gradient(90deg, rgba(0,0,0,.04), transparent 12px); }
    .nav .mark { font-family: var(--serif); font-size: 1.45rem; margin: 0 0 28px; }
    .nav ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    .nav li button { width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; color: var(--muted); min-height: 44px; }
    .nav li button.on { background: var(--surface); color: var(--brand); font-weight: 600; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) 148px; gap: 0; max-width: 960px; margin: 0 auto; padding: 36px 32px 64px 40px; }
    .margin-col { padding: 8px 0 0 20px; border-left: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.5; }
    .margin-col .week { writing-mode: vertical-rl; text-orientation: mixed; font-family: var(--serif); font-size: 15px; color: var(--brand); letter-spacing: 0.12em; margin-bottom: 24px; height: 120px; }
    .margin-col p { margin: 0 0 16px; max-width: 12ch; }
    .margin-col .stamp { width: 28px; height: 28px; background: var(--danger); color: #fff; display: grid; place-items: center; font-size: 14px; font-family: var(--serif); margin-top: 8px; }
    .main-col { padding-right: 32px; }
    .kicker { margin: 0 0 4px; font-size: 13px; color: var(--brand); font-weight: 600; }
    h1 { font-size: clamp(2rem, 4vw, 2.65rem); line-height: 1.15; margin-bottom: 6px; }
    .lede { margin: 0 0 28px; color: var(--muted); font-size: 15px; max-width: 38ch; }
    .capture { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); padding: 6px 6px 6px 14px; margin-bottom: 40px; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
    .capture input { flex: 1; border: 0; background: transparent; min-height: 44px; outline: none; }
    .btn-go { min-height: 44px; padding: 0 18px; background: var(--accent); color: #fff; font-weight: 600; border-radius: 8px; }
    .sec-title { font-size: 1.25rem; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .tasks { display: flex; flex-direction: column; gap: 0; margin-bottom: 36px; }
    .task { display: grid; grid-template-columns: 52px 1fr; gap: 12px 20px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: start; }
    .task:first-child { border-top: 1px solid var(--line); }
    .task .no { font-family: var(--serif); font-size: 2.1rem; line-height: 1; color: var(--brand); padding-top: 2px; }
    .task h3 { font-family: var(--sans); font-size: 1.0625rem; font-weight: 600; }
    .task .meta { font-size: 14px; color: var(--muted); margin-top: 4px; }
    .task.late h3::after { content: " · 逾期"; color: var(--danger); font-weight: 600; }
    .fold { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .panel { background: var(--surface); border: 1px solid var(--line); padding: 16px 18px; }
    .panel h2 { font-size: 1rem; margin-bottom: 12px; font-family: var(--sans); font-weight: 600; }
    .time-row { display: grid; grid-template-columns: 72px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .time-row:first-of-type { border-top: 0; }
    .time-row time { color: var(--muted); font-variant-numeric: tabular-nums; }
    .goal-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .goal-line:first-of-type { border-top: 0; }
    .goal-line span { color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; }
    .tag-demo { position: fixed; top: 12px; right: 12px; background: var(--ink); color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 6px; opacity: .85; }
    @media (max-width: 800px) {
      .shell { grid-template-columns: 1fr; }
      .nav { display: none; }
      .stage { grid-template-columns: 1fr; padding: 24px 20px 48px; }
      .margin-col { display: none; }
      .fold { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <p class="tag-demo">方向 A · 刻印</p>
  <div class="shell">
    <aside class="nav" aria-label="导航">
      <p class="mark">Daydesk</p>
      <ul>
        <li><button type="button" class="on">今天</button></li>
        <li><button type="button">待办</button></li>
        <li><button type="button">灵感</button></li>
        <li><button type="button">日程</button></li>
        <li><button type="button">复盘</button></li>
      </ul>
    </aside>
    <div class="stage">
      <div class="main-col">
        <p class="kicker">11 月 26 日 · 周三</p>
        <h1>今天</h1>
        <p class="lede">先看这三件事，再看时间、本周要交的和收集箱。</p>
        <form class="capture" onsubmit="return false">
          <input type="text" placeholder="记下一句，回车放进收集箱" maxlength="140" aria-label="记下一句灵感">
          <button class="btn-go" type="submit">收下</button>
        </form>
        <h2 class="sec-title">现在就做这三件</h2>
        <div class="tasks">
          <article class="task late">
            <span class="no" aria-hidden="true">一</span>
            <div>
              <h3>把周报发给项目组</h3>
              <p class="meta">挂到「本周交付 MVP 演示」· 高优先级</p>
            </div>
          </article>
          <article class="task">
            <span class="no" aria-hidden="true">二</span>
            <div>
              <h3>整理下午会议材料</h3>
              <p class="meta">16:00 已占位</p>
            </div>
          </article>
          <article class="task">
            <span class="no" aria-hidden="true">三</span>
            <div>
              <h3>回复张总关于预算的邮件</h3>
              <p class="meta">等待别人 · 已 4 天</p>
            </div>
          </article>
        </div>
        <div class="fold">
          <section class="panel">
            <h2>今天的时间</h2>
            <div class="time-row"><time>09:30</time><div><strong>站会</strong></div></div>
            <div class="time-row"><time>16:00</time><div><strong>整理会议材料</strong></div></div>
          </section>
          <section class="panel">
            <h2>本周要交出去的</h2>
            <div class="goal-line"><span>2/5</span> MVP 演示可点击</div>
            <div class="goal-line"><span>0/3</span> 复盘模板定稿</div>
            <div class="goal-line"><span>1/2</span> 灵感文章发布</div>
          </section>
        </div>
      </div>
      <aside class="margin-col" aria-label="旁注">
        <p class="week">第四十八周</p>
        <p>昨日复盘点名的待办已排到第一。</p>
        <p>收集箱还有 3 条未分流。</p>
        <span class="stamp" title="要看一眼">警</span>
      </aside>
    </div>
  </div>
</body>
</html>
